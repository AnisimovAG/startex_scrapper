name:
    css: null
    xpath: >-
        .//div[@class="product-title"]/h1 |
        .//div[contains(@class, "detail-title-section")]
    type: Text
id:
    css: null
    xpath: >-
        .//div[@id="detail-favorite-mark"]/@data-fav-id |
        .//div[@id="prodict-favorite"]/@data-fav-id
    type: HTML
prices:
    css: null
    xpath: './/div[@id="module_price"]'
    type: HTML
prices_product_price:
    css: null
    xpath: './/div[@class="product-price"]'
    type: HTML
    children:
        thresholds:
            css: null
            xpath: './div[@class="price-item"]/div[@class="quality"]'
            multiple: true
            type: Text
            format: FirstDecimalNumber
        prices:
            css: null
            xpath: './div[@class="price-item"]/div[@class="price"]'
            multiple: true
            type: Text
            format: FirstDecimalNumber
        prices_range:
            css: null
            xpath: >- 
                ./div[@class="price-range"]/span[@class="price" or @class="promotion"] |
                ./div[@class="promotion-price"]/strong
            type: Text
        thresholds_range:
            css: null
            xpath: >- 
                ./div[@class="price-range"]/span[@class="moq"] |
                ./div[@class="promotion-price"]/span[@class="promotion-moq"]
            type: Text
            format: FirstDecimalNumber
min_order_txt:
    css: 'div[class="item-tips"]'
    xpath: null
    type: Text
colors:
    css: null
    xpath: >-
        .//div[@id="module_sku"]//dd[@class="sku-attr-val value util-clearfix"]/*[@data-role="sku-attr-val"] |
        .//div[contains(@class, "sku-item") and ./label/text()="Цвет"]/div[contains(@class, "item-size")]/a |
        .//div[contains(@class, "sku-item") and ./label/text()="Color"]/div[contains(@class, "item-size")]/a |
        .//div[contains(@class, "sku-item") and ./label/text()="Цвет"]/div[contains(@class, "item-size")]//div[@class="sku-option"] |
        .//div[contains(@class, "sku-item") and ./label/text()="Color"]/div[contains(@class, "item-size")]//div[@class="sku-option"]
    multiple: true
    type: HTML
video:
    css: null
    xpath: './/div[@class="bc-video-player"]/video/@src'
    format: VideoLink
    type: HTML
photos:
    css: null
    xpath: >- 
        .//li[contains(@class, "main-image-thumb-item")]/img/@src |
        .//div[@class="main-list"]/div[contains(@class, "main-item")]/img/@src
    multiple: true
    format: PhotoLink
    type: HTML
production:
    css: null
    xpath: >- 
        .//div[@id="module_market_action"]//table[contains(@class, "supply-ability-table")] |
        .//div[@class="lead-list"]/table
    type: HTML
    children:
        thresholds:
            css: null
            xpath: './tbody/tr[1]/td'
            multiple: true
            type: Text
        days:
            css: null
            xpath: './tbody/tr[2]/td'
            multiple: true
            type: Text
supplier_url:
    css: null
    xpath: >-
        .//a[@class="company-name company-name-lite-vb"]/@href |
        .//div[@class="company-card is-gs"]/div[@class="company-head"]/div[@class="company-item"]/a/@href
    type: HTML
supplier_name:
    css: null
    xpath: >- 
        .//a[@class="company-name company-name-lite-vb"]/@title |
        .//div[@class="company-card is-gs"]/div[@class="company-head"]/div[@class="company-item"]/a
    type: Text
product_description1:
    css: null
    xpath: './/div[@id="detail_decorate_root"]'
    type: HTML
specification1:
    css: null
    xpath: './/div[@id="detail_decorate_root"]//div[@class="ife-detail-decorate-table"]/table[1]/tbody/tr'
    multiple: true
    type: HTML
    children:
        name:
            css: null
            xpath: './td[1]/div'
            type: Text
        value:
            css: null
            xpath: './td[2]/div'
            type: Text
product_description2:
    css: null
    xpath: './/div[@id="module_product_specification"]'
    type: HTML
specification2:
    css: null
    xpath: './/div[@id="module_product_specification"]//table[1]/tbody/tr'
    multiple: true
    type: HTML
    children:
        name:
            css: null
            xpath: './td[1]'
            type: Text
        value:
            css: null
            xpath: './td[2]'
            type: Text
category:
    css: null
    xpath: './/div[@class="detail-subscribe"]/ol'
    type: HTML
    children:
        hierarchy:
            css: null
            xpath: './li/a/span'
            type: Text
            multiple: true
category_alt:
    css: null
    xpath: './/div[@class="breadcrumb-layout"]//ul'
    type: HTML
    children:
        hierarchy:
            css: null
            xpath: './li/a'
            type: Text
            multiple: true