
version: "3"

services:
  scraper:
    build:
      args:
        user: ${USER}
        uid: ${USERID}
      context: ./
      dockerfile: dev.Dockerfile
    restart: always
    hostname: scraper
    container_name: scraper
    volumes:
      - ./:/opt/scraper/
    command:
      - tail
      - -f
      - /dev/null
    networks:
      default:
    cap_add:
      - NET_ADMIN
    environment:
      NO_SANDBOX: ${NO_SANDBOX}

